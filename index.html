<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Basics Project</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Testing Basics Project</h1>
            <p>A simple project demonstrating HTML, CSS, JavaScript, and Testing</p>
        </header>

        <main>
            <section class="calculator-section">
                <h2>Simple Calculator</h2>
                <div class="calculator">
                    <input type="number" id="num1" placeholder="Enter first number" class="input-field">
                    <input type="number" id="num2" placeholder="Enter second number" class="input-field">
                    
                    <div class="button-group">
                        <button id="addBtn" class="btn btn-add">Add</button>
                        <button id="subtractBtn" class="btn btn-subtract">Subtract</button>
                        <button id="multiplyBtn" class="btn btn-multiply">Multiply</button>
                        <button id="divideBtn" class="btn btn-divide">Divide</button>
                    </div>

                    <div id="result" class="result">
                        <p>Result: <span id="resultValue">-</span></p>
                    </div>
                </div>
            </section>

            <section class="counter-section">
                <h2>Counter</h2>
                <div class="counter">
                    <p>Count: <span id="counterValue">0</span></p>
                    <div class="button-group">
                        <button id="incrementBtn" class="btn btn-increment">Increment</button>
                        <button id="decrementBtn" class="btn btn-decrement">Decrement</button>
                        <button id="resetBtn" class="btn btn-reset">Reset</button>
                    </div>
                </div>
            </section>

            <section class="todo-section">
                <h2>To-Do List</h2>
                <div class="todo">
                    <input type="text" id="todoInput" placeholder="Add a new task" class="input-field">
                    <button id="addTodoBtn" class="btn btn-add">Add Task</button>
                    <ul id="todoList" class="todo-list">
                        <!-- Tasks will be added here -->
                    </ul>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Testing Basics Project. All rights reserved.</p>
        </footer>
    </div>

    <script src="src/calculator.js"></script>
    <script src="src/counter.js"></script>
    <script src="src/todo.js"></script>
    <script src="src/index.js"></script>
</body>
</html>
